[package]
name = "borrow_mutex"
version = "0.1.3"
edition = "2021"
rust-version = "1.65"
readme = "README.md"
authors = ["Darek Stojaczyk <darek@stojaczyk.pl>"]
repository = "https://github.com/darsto/borrow_mutex"
keywords = ["mutex", "lock", "async", "no_std"]
categories = ["asynchronous", "rust-patterns", "no-std::no-alloc"]
license = "MIT"
description = """
Async Rust Mutex which does not require wrapping the target structure
"""

[dependencies]

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = "0.8"
futures = "0.3"
futures-timer = "3.0"
smol = "2"
tokio = { version = "1.53", features = ["rt", "sync"] }

[[bench]]
name = "mutex"
harness = false
